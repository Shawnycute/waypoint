      - url: https://veterans.ny.gov/office-locations
        verify: true          # find the Niagara entry in the paged directory
  - county: Schuyler
    urls:
      - url: https://veterans.ny.gov/office-locations
        verify: true          # find the Schuyler entry in the paged directory; no county page found yet
  - county: Steuben
    urls:
      - url: https://veterans.ny.gov/node/141
        verify: true          # search title: "Steuben County Veterans Service Agency"
      - url: https://steubencountyny.gov/Directory.aspx?DID=60
        verify: true
  - county: Tioga
    urls:
