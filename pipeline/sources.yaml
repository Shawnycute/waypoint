    - { name: "Vet Center counseling", url: "https://www.vetcenter.va.gov/", verify: true }
    - { name: "Joseph P. Dwyer Veteran Peer Support Program", url: "search veterans.ny.gov for the program page", verify: true }
    - { name: "Veterans Crisis Line", url: "https://www.veteranscrisisline.net/", verify: true }
    - { name: "VA Caregiver Support Program", url: "https://www.caregiver.va.gov/", verify: true }
    - { name: "SSVF housing help", url: "https://www.va.gov/homeless/ssvf/", verify: true }
    - { name: "HUD-VASH housing vouchers", url: "https://www.va.gov/homeless/hud-vash.asp", verify: true }
    - { name: "NY veterans' property tax exemptions", url: "https://www.tax.ny.gov/pit/property/exemption/vetexempt.htm", verify: true }
    - { name: "VA pension", url: "https://www.va.gov/pension/", verify: true }
