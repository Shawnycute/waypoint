# NYS Department of Veterans' Services lists every county agency, VA clinic, and Vet Center.
# Paged with ?page=0 through ?page=11 (about 112 entries). Each entry links to a /location/ page.
directory:
  url: https://veterans.ny.gov/office-locations
  opened: 2026-10-25

county_offices:
  - county: Allegany
    urls:
      - url: https://veterans.ny.gov/location/allegany-county-veterans-service-agency
        opened: 2026-10-25   # lists 6085 State Route 19N, Belmont, NY 14813; 585-268-9387
  - county: Cattaraugus
    urls:
      - url: https://veterans.ny.gov/location/cattaraugus-county-veterans-service-agency
        verify: true          # path seen in the directory listing
      - url: https://www.cattco.gov/departments/veterans-service-agency
        verify: true
  - county: Chautauqua
    urls:
      - url: https://veterans.ny.gov/location/chautauqua-county-veterans-service-agency
        verify: true          # path seen in the directory listing
      - url: https://chautauquacountyny.gov/464/Veteran-Services
        verify: true
  - county: Chemung
    urls:
      - url: https://veterans.ny.gov/location/chemung-county-veterans-service-agency
        verify: true          # path seen in the directory listing
  - county: Erie
    urls:
      - url: https://www3.erie.gov/veterans/about-us
        verify: true
